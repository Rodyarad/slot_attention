[tool.poetry]
name = "pytorch_object_centric_learning_with_slot_attention"
version = "0.1.0"
description = "PyTorch implementation of \"Object-Centric Learning with Slot Attention\""
authors = ["Bryden Fogelman <bryden1995@gmail.com>"]

[tool.poetry.dependencies]
python = "3.13.1"
torch = "2.7.0"
torchvision = "0.22.0"
wandb = "0.19.8"
attrs = "24.3.0"
Pillow = "11.1.0"
numpy = "2.2.1"
pytorch-lightning = "2.5.1"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
